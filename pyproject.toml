[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrun-etl"
version = "0.1.0"
description = "Lab 1: resumable raw Speedrun.com observations in three ODS stores"
requires-python = ">=3.11,<3.12"
dependencies = ["psycopg[binary]==3.3.5", "pymongo==4.18.1", "boto3==1.43.75"]

[project.scripts]
speedrun-etl = "speedrun_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
constraint-dependencies = [
  "botocore==1.43.75", "dnspython==2.8.0", "jmespath==1.1.0",
  "python-dateutil==2.9.0.post0", "s3transfer==0.19.2", "six==1.17.0",
  "tzdata==2026.4", "urllib3==2.7.0", "typing-extensions==4.16.0",
]
